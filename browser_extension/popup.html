<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cert Filter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="icons/icon32.png" alt="" />
      <div class="titles">
        <div class="title">Cert Filter</div>
        <div class="subtitle">Ultra PRO</div>
      </div>
      <span id="hostDot" class="dot" title="Состояние native host"></span>
      <button id="refreshBtn" class="icon-btn" title="Обновить всё">⟳</button>
    </header>

    <div id="banner" class="banner hidden"></div>

    <section class="block">
      <div class="block-head">
        <label for="configSelect">КОНФИГУРАЦИЯ (JSON)</label>
        <div class="config-actions">
          <label class="mini-file" title="Загрузить один или несколько JSON">
            загрузить
            <input
              id="fileInput"
              type="file"
              accept=".json,application/json"
              multiple
            />
          </label>
          <button
            id="restoreConfigsBtn"
            class="mini-btn accent"
            type="button"
            title="Вернуть скрытые конфиги"
            hidden
          >
            вернуть
          </button>
          <button
            id="deleteConfigBtn"
            class="mini-btn danger"
            type="button"
            title="Удалить данные конфига из расширения"
            disabled
          >
            удалить
          </button>
        </div>
      </div>
      <select id="configSelect"></select>
      <div id="configInfo" class="hint"></div>
    </section>

    <section class="block">
      <label for="keyInput">КЛЮЧ</label>
      <div class="row">
        <input
          id="keyInput"
          type="text"
          placeholder="Введите номер ключа..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="applyBtn" class="primary">OK</button>
      </div>
      <div id="resolved" class="hint"></div>
    </section>

    <section class="block" id="configEditSection" hidden>
      <div class="block-head">
        <label>РЕДАКТИРОВАНИЕ JSON</label>
      </div>
      <div class="row">
        <input
          id="editKeyInput"
          type="text"
          placeholder="Ключ..."
          autocomplete="off"
          spellcheck="false"
        />
        <input
          id="editValueInput"
          type="text"
          placeholder="Значение (CN сертификата)..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="actions">
        <button id="saveConfigKeyBtn" class="primary">Сохранить</button>
        <button id="deleteConfigKeyBtn" class="ghost-red">Удалить ключ</button>
      </div>
      <div id="configEditHint" class="hint"></div>
    </section>

    <section class="block">
      <div class="actions">
        <button id="showAllBtn" class="ghost-green">Показать все</button>
        <button id="hideAllBtn" class="ghost-red">Скрыть все</button>
        <button id="reloadCertsBtn" class="ghost">Обновить</button>
      </div>
    </section>

    <section class="block grow">
      <div class="block-head">
        <label for="certSearch">СЕРТИФИКАТЫ</label>
        <span id="certCount" class="counter">0</span>
      </div>
      <input
        id="certSearch"
        type="text"
        placeholder="Поиск сертификата по CN..."
        autocomplete="off"
        spellcheck="false"
      />
      <div id="certList" class="cert-list"></div>
    </section>

    <footer id="log" class="log">Готов</footer>

    <div id="detailsModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-head">
          <div id="detailsTitle" class="modal-title">Свойства сертификата</div>
          <button id="detailsCloseBtn" class="icon-btn" type="button" title="Закрыть">✕</button>
        </div>
        <div id="detailsBody" class="modal-body"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
